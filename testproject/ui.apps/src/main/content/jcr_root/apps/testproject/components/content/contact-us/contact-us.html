<sly data-sly-test="${wcmmode.edit}">
    <div class="cq-placeholder" data-emptytext="${component.title || 'Contact Us Form'}"></div>
</sly>
<sly data-sly-use.model="com.testproject.core.models.ContactUsFormModel">

<div class="contact-us-form-wrapper">
    <div class="contact-us-form-container">
        <h2 class="form-title">Get In Touch With Us</h2>
        <p class="form-description">We'd love to hear from you. Please fill out the form below and we'll get back to you as soon as possible.</p>
        
        <form id="contactUsForm" class="contact-us-form" method="post" action="/bin/contactus">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name <span class="required">*</span></label>
                    <input type="text" id="firstName" name="firstName" placeholder="Enter your first name" required/>
                    <span class="error-message" id="firstName-error"></span>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name <span class="required">*</span></label>
                    <input type="text" id="lastName" name="lastName" placeholder="Enter your last name" required/>
                    <span class="error-message" id="lastName-error"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required/>
                    <span class="error-message" id="email-error"></span>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number"/>
                    <span class="error-message" id="phone-error"></span>
                </div>
            </div>

            <div class="form-row full-width">
                <div class="form-group">
                    <label for="subject">Subject <span class="required">*</span></label>
                    <input type="text" id="subject" name="subject" placeholder="What is this about?" required/>
                    <span class="error-message" id="subject-error"></span>
                </div>
            </div>

            <div class="form-row full-width">
                <div class="form-group">
                    <label for="message">Message <span class="required">*</span></label>
                    <textarea id="message" name="message" placeholder="Tell us more about your inquiry..." rows="6" required></textarea>
                    <span class="error-message" id="message-error"></span>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Send Message</button>
                <button type="reset" class="btn btn-secondary">Clear Form</button>
            </div>
        </form>

        <div id="formResponse" class="form-response"></div>
    </div>
</div>

</sly>

<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
     data-sly-call="${clientlib.all @ categories='testproject.contactus.form'}"/>
